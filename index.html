<!DOCTYPE html>
<html>
<head>
  <title>Be My Valentine 💖</title>
  <style>
    body {
      background: #ffd6e8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 30px;
    }
    button {
      padding: 10px 25px;
      margin: 10px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      position: relative;
    }
    .yes {
      background: #ff4d88;
      color: white;
    }
    .no {
      background: #ddd;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Kalyaa ❤️</h1>
    <h2>Will you be my Valentine? 💘</h2>

    <button class="yes" onclick="alert('YAY!! 💖 I knew it 😍')">Yes</button>
    <button class="no" onmouseover="moveNo()">No</button>
  </div>

  <script>
    function moveNo() {
      const noBtn = document.querySelector('.no');
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = translate(${x}px, ${y}px);
    }
  </script>
</body>
</html>

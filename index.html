<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>

  <style>
    body {
      background: #ffd6e8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      position: relative;
      z-index: 2;
    }

    h1 {
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 30px;
      font-weight: normal;
    }

    button {
      padding: 12px 28px;
      margin: 10px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .yes {
      background: #ff4d88;
      color: white;
    }

    .no {
      background: #ddd;
      position: absolute;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Kalyaa ❤️</h1>
    <h2>Will you Be my Valentine? 💘</h2>

    <button class="yes" onclick="sayYes()">Yes</button>
    <button class="no" onmouseover="moveNo()">No</button>
  </div>

  <script>
    function sayYes() {
      alert("YAY!! 💖 I knew it 😍");
    }

    function moveNo() {
      const noBtn = document.querySelector(".no");

      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.innerText = "Nice try 😏";
    }
  </script>

</body>
</html>

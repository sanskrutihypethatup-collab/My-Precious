<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kalyaa 💖</title>

  <style>
    body {
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #e6f4ee;
      padding: 40px 50px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 420px;
    }

    h1 {
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 30px;
      font-weight: normal;
    }

    .buttons {
      position: relative;
      height: 90px;
    }

    .yes {
      padding: 12px 28px;
      border-radius: 20px;
      border: none;
      background: #ff5c8a;
      color: white;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
      left: 40px;
    }

    /* 🔥 NO BUTTON WRAPPER (THIS IS THE BACKGROUND YOU ARROWED) */
    .no-wrapper {
      position: absolute;
      right: 40px;
      top: 0;
      width: 90px;
      height: 55px;
      background: #cccccc;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .no-wrapper span {
      pointer-events: none;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Kalyaa ❤️</h1>
    <h2>Will you be my Valentine? 💘</h2>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes</button>

      <!-- NO button with fixed background -->
      <div class="no-wrapper" id="noBtn">
        <span>No</span>
      </div>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const container = document.querySelector(".buttons");

    noBtn.addEventListener("mouseenter", () => {
      const containerRect = container.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = containerRect.width - btnRect.width;
      const maxY = containerRect.height - btnRect.height;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function sayYes() {
      alert("YAY!! 💖 I knew it 😍");
    }
  </script>

</body>
</html>

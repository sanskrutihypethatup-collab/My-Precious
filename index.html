<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kalyaa 💖</title>

  <style>
    body {
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #e6f4ee;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
      width: 340px;
      height: 220px;
    }

    h1 {
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 25px;
      font-weight: normal;
    }

    button {
      padding: 12px 26px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
    }

    .yes {
      background: #ff5c8a;
      color: white;
      left: 40px;
      bottom: 30px;
    }

    .no {
      background: #cccccc;
      right: 40px;
      bottom: 30px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Kalyaa ❤️</h1>
    <h2>Will you be my Valentine? 💘</h2>

    <button class="yes" onclick="sayYes()">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const card = document.querySelector(".card");

    noBtn.addEventListener("mouseenter", moveAway);

    function moveAway() {
      const currentX = noBtn.offsetLeft;
      const currentY = noBtn.offsetTop;

      const maxX = card.clientWidth - noBtn.offsetWidth - 20;
      const maxY = card.clientHeight - noBtn.offsetHeight - 20;

      // Movement distance (small dodge)
      const moveDist = 60;  

      let newX = currentX + (Math.random() * moveDist * 2 - moveDist);
      let newY = currentY + (Math.random() * moveDist * 2 - moveDist);

      // Keep inside card bounds
      if (newX < 10) newX = 10;
      if (newX > maxX) newX = maxX;
      if (newY < 10) newY = 10;
      if (newY > maxY) newY = maxY;

      noBtn.style.left = newX + "px";
      noBtn.style.top = newY + "px";
    }

    function sayYes() {
      alert("YAY!! 💖 I knew it 😍");
    }
  </script>

</body>
</html>

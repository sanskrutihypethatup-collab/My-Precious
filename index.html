<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kalyaa 💖</title>

  <style>
    body {
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .card {
      background: #e6f4ee;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
    }

    h1 {
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 25px;
      font-weight: normal;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }

    .yes {
      background: #ff5c8a;
      color: white;
    }

    .no {
      background: #cccccc;
      position: absolute;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Kalyaa ❤️</h1>
    <h2>Will you be my Valentine? 💘</h2>

    <button class="yes" onclick="sayYes()">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.innerText = "Nice try 😏";
    });

    function sayYes() {
      alert("YAY!! 💖 I knew it 😍");
    }
  </script>

</body>
</html>
